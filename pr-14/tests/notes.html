<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sans_bass — notes &amp; key</title>
<style>
  body { background:#0d0d10; color:#e9e9ef; font:13px ui-monospace,Menlo,monospace; padding:24px; }
  pre { background:#141419; padding:14px; border-radius:8px; white-space:pre-wrap; line-height:1.6; }
  code { color:#9ad; }
  /* Same rule styles.css carries, for the same reason: any author rule that sets display
     beats the UA stylesheet's [hidden], and the attribute silently stops working. */
  [hidden] { display:none !important; }
  #transport { background:#141419; padding:12px 14px; border-radius:8px; margin:12px 0;
               display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  #transport button { font:inherit; background:#2a2a35; color:#e9e9ef; border:1px solid #3a3a47;
                      border-radius:5px; padding:5px 12px; cursor:pointer; }
  #transport button:hover:not(:disabled) { background:#343442; }
  #transport button:disabled { opacity:.45; cursor:default; }
  #transport label { color:#8a8a99; display:flex; gap:6px; align-items:center; }
  #transport input[type=number] { width:5em; font:inherit; background:#0d0d10; color:#e9e9ef;
                                  border:1px solid #3a3a47; border-radius:4px; padding:3px 5px; }
  #transport select { font:inherit; background:#0d0d10; color:#e9e9ef; border:1px solid #3a3a47;
                      border-radius:4px; padding:3px 5px; }
  #transport input[type=range] { width:90px; }
  #clock { margin-left:auto; font-variant-numeric:tabular-nums; }
  #playing { color:#9ad; font-weight:700; min-width:3.5em; display:inline-block; }
</style>
</head>
<body>
<h1>notes &amp; key</h1>
<p>Set <code>?track=12 早安台灣</code> for another song, <code>?stem=bass</code> for another stem.
   Any numeric option is overridable, e.g. <code>?driftCents=80&amp;minDurationMs=120</code>.</p>

<div id="transport">
  <button id="play" disabled>▶ Play</button>
  <button id="stop" disabled>■ Stop</button>
  <label>from <input id="from" type="number" min="0" step="1" value="0"> s</label>
  <label>tone
    <select id="timbre">
      <option value="piano">piano</option>
      <option value="guitar">guitar</option>
    </select>
  </label>
  <label>synth <input id="synthVol" type="range" min="0" max="1" step="0.01" value="0.7"></label>
  <label>stem <input id="stemVol" type="range" min="0" max="1" step="0.01" value="0.7"></label>
  <span id="clock">0:00.000 <span id="playing"></span></span>
</div>

<pre id="out">running…</pre>
<script type="module">
import { detectNotes, notesToChroma, detectKey } from '../lib/pitch.js';
import { scheduleNotes, LOOKAHEAD } from '../lib/sonify.js';

const out = document.getElementById('out');
const el = (id) => document.getElementById(id);
const SR = 44100;
const params = new URLSearchParams(location.search);
const TRACK = params.get('track') || '6 南國的風';
const STEM = params.get('stem') || 'vocals';
const URL = `/stems/reborn/${TRACK}/${STEM}.m4a`;

// Sweeping thresholds from the query string beats editing the module between runs.
const TUNABLE = ['window', 'hop', 'tauMin', 'tauMax', 'threshold', 'minConfidence',
                 'silenceDb', 'medianSpan', 'gapFrames', 'driftCents', 'driftFrames',
                 'minDurationMs'];
const opts = {};
for (const k of TUNABLE) if (params.has(k)) opts[k] = Number(params.get(k));

const log = (s = '') => { out.textContent += s + '\n'; };
const mmss = (t) => {
  const m = Math.floor(t / 60);
  return `${m}:${(t - m * 60).toFixed(3).padStart(6, '0')}`;
};

// One context for the whole page, pinned to 44.1 kHz. decodeAudioData resamples to the
// context rate, and a default context is often 48 kHz on macOS — which would silently
// shift every detected pitch. It starts suspended and is resumed by the Play click,
// because a real user gesture is the only thing that unlocks it.
const ctx = new AudioContext({ sampleRate: SR });
const synthGain = ctx.createGain();
const stemGain = ctx.createGain();
synthGain.gain.value = Number(el('synthVol').value);
stemGain.gain.value = Number(el('stemVol').value);
synthGain.connect(ctx.destination);
stemGain.connect(ctx.destination);

async function decode(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${url}`);
  return ctx.decodeAudioData(await res.arrayBuffer());
}

out.textContent = '';
log(`decoding ${URL}`);
const buf = await decode(URL);
const channels = [];
for (let c = 0; c < buf.numberOfChannels; c++) channels.push(buf.getChannelData(c));
log(`  ${buf.duration.toFixed(1)}s @ ${buf.sampleRate} Hz, ${buf.numberOfChannels} ch`);
if (Object.keys(opts).length) log(`  options: ${JSON.stringify(opts)}`);

const t0 = performance.now();
const { notes, frames } = detectNotes(channels, buf.sampleRate, opts);
const seconds = (performance.now() - t0) / 1000;

let voiced = 0;
for (const c of frames.cents) if (c !== 0) voiced++;
log(`  ${frames.cents.length} frames, ${voiced} voiced (${Math.round((100 * voiced) / frames.cents.length)}%), ` +
    `${notes.length} notes in ${seconds.toFixed(1)}s`);

const key = detectKey(notesToChroma(notes));

log('\n== KEY ==');
log(`${key.key}    score ${key.score.toFixed(3)}    margin ${key.margin.toFixed(3)} over ${key.ranked[1].key}`);
log(`relative: ${key.relative} — shares all seven pitch classes with ${key.key}.`);
log(`ranked:   ${key.ranked.map((r) => `${r.key} ${r.score.toFixed(3)}`).join('   ')}`);

log('\n== PHRASES ==   (a new line on any gap over 300 ms; the number is the "from" seconds)');
let line = [];
let lineStart = null;
let prevEnd = null;
const flush = () => { if (line.length) log(`  ${String(Math.floor(lineStart)).padStart(4)}s  ${line.join(' ')}`); };
for (const n of notes) {
  if (prevEnd !== null && n.start - prevEnd > 0.3) { flush(); line = []; lineStart = null; }
  if (lineStart === null) lineStart = n.start;
  line.push(n.name);
  prevEnd = n.end;
}
flush();

log('\n== NOTES ==');
log(['   #', '    start', '   dur', 'note ', ' midi', '  dev', '  conf'].join(' '));
notes.forEach((n, i) => {
  const dev = Math.round(n.cents - n.midi * 100);
  log([
    String(i).padStart(4),
    mmss(n.start).padStart(9),
    String(Math.round((n.end - n.start) * 1000)).padStart(6),
    n.name.padEnd(5),
    String(n.midi).padStart(5),
    ((dev > 0 ? '+' : '') + dev).padStart(5),
    n.confidence.toFixed(2).padStart(6),
  ].join(' '));
});

// A consistent offset across every note means the record sits off A440. Without this line
// the detector takes the blame for what is really a tuning difference.
const meanDev = notes.length
  ? notes.reduce((s, n) => s + (n.cents - n.midi * 100), 0) / notes.length
  : 0;
log(`\nmean deviation ${meanDev > 0 ? '+' : ''}${meanDev.toFixed(1)} cents from equal temperament.`);

// ---------------------------------------------------------------- transport

let stemSrc = null;
let sonifier = null;
let clockT0 = 0;
let startedFrom = 0;
let playing = false;

function stopPlayback() {
  if (sonifier) { sonifier.stop(); sonifier = null; }
  if (stemSrc) {
    stemSrc.onended = null;             // clear first, or stop() re-enters this function
    try { stemSrc.stop(); } catch { /* never started */ }
    stemSrc = null;
  }
  playing = false;
  el('stop').disabled = true;
  el('playing').textContent = '';
}

async function startPlayback() {
  stopPlayback();
  await ctx.resume();                   // only a real user gesture unlocks the context
  const from = Math.max(0, Math.min(buf.duration - 0.05, Number(el('from').value) || 0));

  // One t0 for both sources, exactly as app.js does it — the tone and the singer have to
  // be locked to the same clock or the comparison is worthless.
  clockT0 = ctx.currentTime + LOOKAHEAD;
  startedFrom = from;

  stemSrc = ctx.createBufferSource();
  stemSrc.buffer = buf;
  stemSrc.connect(stemGain);
  stemSrc.onended = () => stopPlayback();
  stemSrc.start(clockT0, from);

  sonifier = scheduleNotes(ctx, synthGain, notes, {
    timbre: el('timbre').value, when: clockT0, offset: from,
  });

  playing = true;
  el('stop').disabled = false;
}

// rAF for drawing and only drawing: the position it shows is read off the audio clock.
let cursor = 0;
function tick() {
  if (playing) {
    const at = Math.max(0, startedFrom + (ctx.currentTime - clockT0));
    if (cursor > 0 && notes[cursor - 1] && notes[cursor - 1].start > at) cursor = 0;   // seeked back
    while (cursor < notes.length && notes[cursor].end < at) cursor++;
    const now = notes[cursor];
    el('clock').firstChild.nodeValue = `${mmss(at)} `;
    el('playing').textContent = now && now.start <= at ? now.name : '';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

el('play').addEventListener('click', startPlayback);
el('stop').addEventListener('click', stopPlayback);
el('synthVol').addEventListener('input', (e) => {
  synthGain.gain.setTargetAtTime(Number(e.target.value), ctx.currentTime, 0.01);
});
el('stemVol').addEventListener('input', (e) => {
  stemGain.gain.setTargetAtTime(Number(e.target.value), ctx.currentTime, 0.01);
});
el('timbre').addEventListener('change', () => { if (playing) startPlayback(); });
el('from').max = Math.floor(buf.duration);
el('play').disabled = false;

window.__notes = {
  track: TRACK, stem: STEM, opts,
  seconds: +seconds.toFixed(1),
  frameCount: frames.cents.length,
  voicedFrames: voiced,
  noteCount: notes.length,
  meanDeviationCents: +meanDev.toFixed(1),
  key,
  notes,
};
window.__transport = {
  play: startPlayback, stop: stopPlayback,
  state: () => ({ playing, contextState: ctx.state,
                  at: playing ? startedFrom + (ctx.currentTime - clockT0) : null,
                  synth: synthGain.gain.value, stem: stemGain.gain.value }),
};
console.log('[notes]', JSON.stringify({ ...window.__notes, notes: `${notes.length} notes` }));
</script>
</body>
</html>
