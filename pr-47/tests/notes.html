<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sans_bass — notes &amp; key</title>
<style>
  body { background:#0d0d10; color:#e9e9ef; font:13px ui-monospace,Menlo,monospace; padding:24px; }
  pre { background:#141419; padding:14px; border-radius:8px; white-space:pre-wrap; line-height:1.6; }
  code { color:#9ad; }
  /* Same rule styles.css carries, for the same reason: any author rule that sets display
     beats the UA stylesheet's [hidden], and the attribute silently stops working. */
  [hidden] { display:none !important; }
  #transport { background:#141419; padding:12px 14px; border-radius:8px; margin:12px 0;
               display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  #transport button { font:inherit; background:#2a2a35; color:#e9e9ef; border:1px solid #3a3a47;
                      border-radius:5px; padding:5px 12px; cursor:pointer; }
  #transport button:hover:not(:disabled) { background:#343442; }
  #transport button:disabled { opacity:.45; cursor:default; }
  #transport label { color:#8a8a99; display:flex; gap:6px; align-items:center; }
  #transport input[type=number] { width:5em; font:inherit; background:#0d0d10; color:#e9e9ef;
                                  border:1px solid #3a3a47; border-radius:4px; padding:3px 5px; }
  #transport select { font:inherit; background:#0d0d10; color:#e9e9ef; border:1px solid #3a3a47;
                      border-radius:4px; padding:3px 5px; }
  #transport input[type=range] { width:90px; }
  #clock { margin-left:auto; font-variant-numeric:tabular-nums; }
  #playing { color:#9ad; font-weight:700; min-width:3.5em; display:inline-block; }
</style>
  <script type="module" crossorigin src="../assets/notes-COBhTOrz.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="../assets/sonify-BuepCsos.js">
</head>
<body>
<h1>notes &amp; key</h1>
<p>Set <code>?track=12 早安台灣</code> for another song, <code>?stem=bass</code> for another stem.
   Any numeric option is overridable, e.g. <code>?driftCents=80&amp;minDurationMs=120</code>.</p>

<div id="transport">
  <button id="play" disabled>▶ Play</button>
  <button id="stop" disabled>■ Stop</button>
  <label>from <input id="from" type="number" min="0" step="1" value="0"> s</label>
  <label>tone
    <select id="timbre">
      <option value="piano">piano</option>
      <option value="guitar">guitar</option>
    </select>
  </label>
  <label>synth <input id="synthVol" type="range" min="0" max="1" step="0.01" value="0.7"></label>
  <label>stem <input id="stemVol" type="range" min="0" max="1" step="0.01" value="0.7"></label>
  <span id="clock">0:00.000 <span id="playing"></span></span>
</div>

<pre id="out">running…</pre>
</body>
</html>
