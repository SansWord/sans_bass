<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sans_bass — stem player</title>
<!-- Icons. Relative paths, never root-relative: the per-PR preview at /pr-<N>/ would 404 on
     a leading slash. apple-touch-icon must be a PNG — iOS ignores an SVG here — and it is
     180x180 full bleed because iOS applies its own corner mask. theme-color stops Safari
     painting default light chrome above a near-black page. -->
<link rel="icon" href="./assets/icon-CNNK3h42.svg" type="image/svg+xml">
<link rel="icon" href="./assets/favicon-32-D9nVlJ2I.png" sizes="32x32">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon-BWNmolE4.png">
<meta name="theme-color" content="#0d0d10">
<!-- i18n loads in <head>, before anything paints, so `lang` and the tab title are already
     right and the DOM walk can run the moment the body exists. init() is called explicitly
     rather than on load, so tests/i18n.test.js can import lib/i18n.js directly (under
     Vitest's jsdom environment) without having its own title rewritten. The literal English
     in the markup below is the no-JS fallback and the readable source of truth; it matches
     DICT.en exactly. -->
<!-- Anonymous, cookieless usage counts. External, so Vite leaves the URL alone — and
     https:// rather than the protocol-relative //gc.zgo.at from GoatCounter's docs, to
     keep it an unambiguous absolute URL. -->
<script data-goatcounter="https://sansword.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
  <script type="module" crossorigin src="./assets/main-BLOoTu9k.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/SiteHeader-MtOhwA2m.js">
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="./assets/sonify-DfBfGpzd.js">
  <link rel="stylesheet" crossorigin href="./assets/SiteHeader-DXOZa5Vk.css">
</head>
<body>

<header class="bar" id="site-header"></header>

<main id="app">

  <div id="loading-ui-root"></div>

  <section id="player" hidden>
    <div class="master">
      <div id="playback-button-ui-root" class="react-portal-host"></div>
      <div class="master-mid">
        <div id="title" class="title">&mdash;</div>
        <div id="primary-seek-ui-root" class="react-portal-host"></div>
      </div>
      <div id="primary-time-ui-root" class="react-portal-host"></div>
    </div>

    <div class="controls">
      <div id="mode-routing-ui-root" class="react-portal-host"></div>
      <div id="master-volume-ui-root" class="react-portal-host"></div>
      <div id="playback-speed-ui-root" class="react-portal-host"></div>
      <div id="loop-controls-ui-root" class="react-portal-host"></div>
      <!-- Two spans, not one string: the keyboard half is meaningless on a touch screen and
           is hidden there, while the click/tap hint is exactly what a first-time user on a
           phone needs. See the .hint rules in styles.css. -->
      <p class="hint dim">
        <span class="hint-click" data-i18n-html="hint.click">Click a lane&rsquo;s <strong>name</strong> to mute or unmute that track</span>
        <span class="hint-keys" data-i18n-html="hint.keys">space play &middot; &larr;&rarr; seek 5s &middot; 1-6 stem &middot; 0 mute/unmute all
          &middot; <strong>a</strong>/<strong>b</strong> loop &middot; <strong>c</strong> clear the A&ndash;B loop</span>
      </p>
    </div>

    <!-- React-owned (Phase 5a): availability/gating, including the handheld explanation,
         start/progress/cancel/error/save presentation. See components/SeparationPanel.jsx. -->
    <div id="separation-ui-root" class="react-portal-host"></div>

    <!-- Detection is button-triggered, never automatic: the first run is ~7 s of CPU on a
         4-minute track, and unbidden CPU that size is a surprise rather than a convenience.
         One shared button (#notes-go-all) triggers whichever of vocals/bass still needs
         analysis — a zip with only one melodic stem detects just that one. The section
         disables (never hides) when no melodic stem was ever loaded — nothing this button
         could ever do for this song — but once every present stem IS analysed, the whole
         section hides outright: a leftover disabled button would itself look stale. While
         busy, a spinner and a "Detecting: <stems>" hint next to it name whichever stem(s)
         are still in flight, so one channel finishing first is never mistaken for the whole
         run being done. Two independent panels — one per note-capable stem — otherwise stay
         separate: each gated on its own stem's presence, with their own count/toggle/tune/
         edit-list/list-export controls all hidden until that channel actually has notes (same
         illusion-of-completion problem, same fix). Edit notes moves to one global toggle
         beside the zoomed pane's two Notes chips (built by app.js), since only one channel
         is ever edited at a time; Export/Import edits follow it out there too, next to that
         toggle, for the same reason — one shared pair combining both stems' edits into one
         JSON file, rather than a pair per panel (notes.js listens for the
         'sansbass:exportedits'/'sansbass:importedits' events app.js dispatches, since app.js
         has no reach into this module's channel state). The tempo grid moves to its own
         shared section below, hidden the same way until a real detection succeeds, since it
         is derived from drums and has never depended on which melodic stem is being read. See
         docs/superpowers/specs/2026-09-01-bass-notes-design.md and lib/notes-edits.js. -->
    <!-- React-owned (Phase 5b): shared Find-notes button/spinner/busy-channel status. See
         components/DetectionPanel.jsx's DetectionControls. -->
    <div id="detection-ui-root" class="react-portal-host"></div>

    <section id="notes-vocals" class="notes" hidden>
      <div class="notes-row">
        <strong class="notes-panel-label" data-i18n="stem.vocals">Vocals</strong>
      </div>
      <!-- React-owned (Phase 5b): count, Show/Hide, 簡譜, and key tonic/mode/relative-key.
           See components/DetectionPanel.jsx's NotesChannelPanel. The tune/edits/list-io
           siblings below stay legacy-owned (Phase 6). -->
      <div id="notes-meta-vocals-root" class="react-portal-host"></div>
      <!-- React-owned (Phase 6a): shortest-note slider and the Advanced disclosure
           (clip/hmm/fold + fold tolerance/stats). See
           components/InterpretationPanel.jsx. The edits/list-io siblings below stay
           legacy-owned (a later Phase 6 sub-slice). -->
      <div id="notes-tune-vocals-root" class="react-portal-host"></div>
      <details id="notes-edits-vocals" class="notes-edit-list" hidden>
        <summary id="notes-edits-summary-vocals"></summary>
        <div class="notes-row notes-edit-panel">
          <button id="notes-edit-undo-vocals" class="mini" type="button" disabled
                  data-i18n-attr="title:notes.editUndoTip">&#8630;</button>
          <ol id="notes-edit-rows-vocals" class="edit-rows"></ol>
        </div>
      </details>
      <div id="notes-list-io-vocals" class="notes-row">
        <label class="notes-ctl">
          <span data-i18n="notes.listBars">Bars per line</span>
          <input id="notes-list-bars-vocals" type="number" min="1" max="16" step="1" value="4">
        </label>
        <button id="notes-list-export-vocals" class="mini" type="button" disabled data-i18n="notes.exportList">Export list</button>
      </div>
    </section>

    <section id="notes-bass" class="notes" hidden>
      <div class="notes-row">
        <strong class="notes-panel-label" data-i18n="stem.bass">Bass</strong>
      </div>
      <!-- React-owned (Phase 5b): see the vocals section's equivalent comment above. -->
      <div id="notes-meta-bass-root" class="react-portal-host"></div>
      <!-- React-owned (Phase 6a): see the vocals section's equivalent comment above. -->
      <div id="notes-tune-bass-root" class="react-portal-host"></div>
      <details id="notes-edits-bass" class="notes-edit-list" hidden>
        <summary id="notes-edits-summary-bass"></summary>
        <div class="notes-row notes-edit-panel">
          <button id="notes-edit-undo-bass" class="mini" type="button" disabled
                  data-i18n-attr="title:notes.editUndoTip">&#8630;</button>
          <ol id="notes-edit-rows-bass" class="edit-rows"></ol>
        </div>
      </details>
      <div id="notes-list-io-bass" class="notes-row">
        <label class="notes-ctl">
          <span data-i18n="notes.listBars">Bars per line</span>
          <input id="notes-list-bars-bass" type="number" min="1" max="16" step="1" value="4">
        </label>
        <button id="notes-list-export-bass" class="mini" type="button" disabled data-i18n="notes.exportList">Export list</button>
      </div>
    </section>

    <!-- Shared: tempo is derived from the drums stem and has never depended on which melodic
         stem is being read, so it lives once regardless of how many note panels exist above.
         React-owned since Phase 6b — see components/TempoPanel.jsx. -->
    <div id="tempo-ui-root" class="react-portal-host"></div>

    <div id="lanes" class="lanes">
      <div id="standard-lanes-root" class="react-portal-host"></div>
      <div id="overview-lane-root" class="react-portal-host"></div>
      <div id="note-lanes-root"></div>
    </div>
  </section>

  <div id="status-ui-root"></div>
</main>

<!-- The visible drop target. #dropzone above explains the two ways in, but it disappears
     as soon as a song loads; this covers the window in both states, and is the only thing
     on screen while a file is being dragged. pointer-events: none — see PlayerShell.jsx. -->
<div id="drag-overlay-root"></div>
<div id="player-react-root" data-react-player-shell hidden></div>

<!-- Which commit is actually live, for checking a deploy (dev, PR preview, or main) is the
     one under test — see vite.config.js's __COMMIT_SHA__. Decorative/technical, not
     content, so it's out of the accessibility tree like the header's brand mark. -->
<div id="build-sha" class="build-sha" aria-hidden="true"></div>

</body>
</html>
