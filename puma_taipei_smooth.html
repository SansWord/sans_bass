<!-- Tempo grid without notes detection.
     `tempoGrid` runs its own drums-only detector, so the grid does not depend on the note
     detection this page hides. redetect() is what establishes a confidence, which is what
     makes the panel and the grid visible at all; the BPM and phase are then overridden.

     This song is detected at 68.2 BPM / 280 ms phase, which is half the rate it is actually
     felt at. 136.4 is that doubled. The phase was measured rather than guessed: scoring an
     onset-flux envelope of the drums stem across every candidate phase peaks at 290 ms for
     68.2 (lift 1.67x over the mean) and 292 ms for 136.4 (lift 1.37x), so 290 ms sits on the
     optimum at both rates and within one analysis hop (5.8 ms) of the detector's own answer.
     Doubling the rate keeps the original beats and adds one between each, so the same phase
     holds.

     A module script here is bundled and hoisted like any other, so this runs after app.js —
     which is what we want. It waits for the song rather than assuming any ordering. -->
<script type="module">
import { playerApplication } from './lib/player-application.js';
import { tempoGrid } from './notes.js';

const BPM = 136.4;
const PHASE_MS = 290;

let started = false;

function hasDrums() {
  const snapshot = playerApplication.getSnapshot();
  return !!snapshot.song?.tracks?.some((track) => track.stem === 'drums');
}

function deriveGrid() {
  const stop = tempoGrid.subscribe((view) => {
    // Wait for the run to finish AND to have produced a confidence; a failed detection
    // leaves confidence at 0, and overriding the BPM then would show a grid nothing backs.
    if (view.redetecting || !view.confidence) return;
    stop();
    tempoGrid.commands.setBpm(BPM);
    tempoGrid.commands.setPhase(PHASE_MS);
    tempoGrid.commands.setOn(true);
  });
  tempoGrid.commands.redetect();
}

// Declared before check() rather than as a const after it: check() runs once directly below,
// and a const would still be in its temporal dead zone if subscribe() ever called back
// synchronously.
let unsubscribe = null;

function check() {
  if (started || !hasDrums()) return;
  started = true;
  unsubscribe?.();
  deriveGrid();
}

unsubscribe = playerApplication.subscribe(check);
check();   // the song may already be loaded by the time this runs
</script>
